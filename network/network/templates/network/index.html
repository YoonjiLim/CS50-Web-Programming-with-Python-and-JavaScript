{% extends "network/layout.html" %}

{% block body %}

    <h2>All Posts</h2>
    <div id="new-post">
        {% csrf_token %}
        
        <textarea id="post-content" placeholder="Write a new post."></textarea>
        <div class="post-submit">
            <button id="submit-post">Submit</button>
        </div>
    </div>
    
    <div id="posts-container" data-url="/posts"></div>
    <div id="pagination" class="pagination"></div>                    
{% endblock %}
